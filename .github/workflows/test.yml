name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19
          cache: npm
      # The lockfile is tracked, so `npm ci` reproduces the audited tree
      # exactly — a package.json edit without a lockfile refresh fails
      # here instead of shipping a silently stale tree.
      - run: npm ci
      # #2b type green gate: the same checkJs pass the declaration build
      # runs, as a hard noEmit gate before any behavior test.
      - run: npm run typecheck
      # host-test stubs the one supported projection seam (plus a deliberately
      # wrong shape for guardrail B) and both settings generations, so every
      # push re-proves the host contracts the plugin depends on.
      - run: npm test
